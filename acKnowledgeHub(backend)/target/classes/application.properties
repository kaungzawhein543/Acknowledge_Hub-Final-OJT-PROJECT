spring.application.name=ackKnowledgeHub
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/acknowledge_hub;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.main.allow-circular-references=true

spring.jackson.serialization-indentation.max-nesting-depth=2000

jwt.secret=${JWT_SECRET}

#defaultProfileURL
default.photo.path=${DEFAULT_PHOTO_PATH:/defaultProfile/profile.jpg}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.debug=false

#logging.level.org.springframework.mail=DEBUG
#spring.mail.properties.mail.debug=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=20MB

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

bot.name=${TELEGRAM_BOT_NAME}
bot.token=${TELEGRAM_BOT_TOKEN}
bot.enabled=${TELEGRAM_BOT_ENABLED:false}

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.backend-url=${BACKEND_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.telegram-bot-url=${TELEGRAM_BOT_URL:https://t.me/AcKnowledgeHubBot}

app.default-password.user=${DEFAULT_USER_PASSWORD:acknowledgeHub}
app.default-password.admin=${DEFAULT_ADMIN_PASSWORD:adminPassword}
app.seed.admin.staff-id=${SEED_ADMIN_STAFF_ID:ADMIN001}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
app.seed.user.staff-id=${SEED_USER_STAFF_ID:EMP001}
app.seed.user.email=${SEED_USER_EMAIL:user@example.com}